# Validate — lightweight config + syntax validation for pull requests and pushes.
# Runs WITHOUT access to production secrets or GitHub Pages; only validates files.
name: "Validate"

on:
  pull_request:
    paths:
      - "config/**"
      - "scripts/**"
      - "lib/**"
      - ".github/workflows/validate.yml"
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "scripts/**"
      - "lib/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static syntax check
        run: npm run check

      - name: Validate configuration
        run: npm run validate:config

      - name: Validate semantic configs
        run: node scripts/validate-semantic.mjs

      - name: Validate AI documentation
        run: node scripts/validate-ai-docs.mjs
